<div>
  <div>
    <h2>Categorias</h2>
    <a routerLink="/categorias/nova">Nova Categoria</a>
  </div>

  @if (erro()) {
    <p style="color: red;">{{ erro() }}</p>
  }

  @if (categorias().length === 0 && !erro()) {
    <p>Nenhuma categoria cadastrada.</p>
  }

  @if (categorias().length > 0) {
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Descrição</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        @for (categoria of categorias(); track categoria.id) {
          <tr>
            <td>{{ categoria.nome }}</td>
            <td>{{ categoria.descricao }}</td>
            <td>
              <button (click)="deletar(categoria.id!)">Excluir</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
